<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>골프존 회계감사 진행 관리 화면</title>
  <style>
    :root {
      --navy: #123a6f;
      --blue: #1f64c8;
      --ink: #14243a;
      --muted: #617188;
      --line: #d9e3f0;
      --bg: #f4f7fb;
      --green: #138462;
      --amber: #ad6b00;
      --gray: #65758b;
      --red: #b42318;
      --purple: #6657c8;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--ink);
      font-family: Arial, "Pretendard", "Noto Sans KR", sans-serif;
    }

    button, a { font: inherit; }

    .page {
      width: min(100vw, 1600px);
      min-height: 100vh;
      margin: 0 auto;
      padding: 24px 38px 28px;
    }

    .stage {
      min-height: calc(100vh - 52px);
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    header {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 24px;
      align-items: start;
      padding: 18px 20px;
      background: #fff;
      border: 1px solid var(--line);
      border-radius: 8px;
    }

    .proposal {
      display: flex;
      align-items: center;
      gap: 14px;
      min-width: 0;
    }

    .mark {
      width: 42px;
      height: 42px;
      display: grid;
      place-items: center;
      flex: 0 0 auto;
      color: #fff;
      background: var(--navy);
      border-radius: 8px;
      font-weight: 800;
      letter-spacing: 0;
    }

    .proposal-title {
      font-size: 15px;
      font-weight: 800;
      color: #233a59;
    }

    .proposal-sub {
      margin-top: 5px;
      color: var(--muted);
      font-size: 12px;
    }

    .doc-tag {
      display: flex;
      gap: 8px;
      align-items: center;
      justify-content: flex-end;
      flex-wrap: wrap;
      color: #385371;
      font-size: 12px;
      font-weight: 700;
    }

    .tag {
      padding: 6px 10px;
      border: 1px solid #c9d8ea;
      border-radius: 999px;
      background: #fff;
      white-space: nowrap;
    }

    .titlebar {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 28px;
      align-items: end;
      padding: 2px 2px 0;
    }

    h1 {
      margin: 0;
      font-size: clamp(27px, 2.8vw, 40px);
      line-height: 1.15;
      letter-spacing: 0;
      color: #10263f;
    }

    .lead {
      margin: 7px 0 0;
      max-width: 860px;
      color: #53657d;
      font-size: 14px;
      line-height: 1.5;
    }

    .legend {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      justify-content: flex-end;
      font-size: 12px;
      color: #52677f;
    }

    .tabs {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 10px;
    }

    .tab {
      min-height: 52px;
      text-align: left;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #fff;
      color: #304964;
      cursor: pointer;
      padding: 11px 15px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      font-weight: 800;
    }

    .tab small {
      display: block;
      margin-top: 3px;
      color: #77869a;
      font-size: 11px;
      font-weight: 600;
    }

    .tab.active {
      color: #fff;
      background: var(--blue);
      border-color: var(--blue);
      box-shadow: 0 10px 20px rgba(31, 100, 200, .18);
    }

    .tab.active small { color: rgba(255, 255, 255, .82); }

    .tab-num {
      width: 28px;
      height: 28px;
      display: grid;
      place-items: center;
      flex: 0 0 auto;
      border-radius: 999px;
      background: #edf4fd;
      color: var(--blue);
      font-size: 12px;
      font-weight: 900;
    }

    .tab.active .tab-num {
      background: rgba(255, 255, 255, .18);
      color: #fff;
    }

    #screen { flex: 1; min-height: 0; }

    .panel {
      height: 100%;
      min-height: 580px;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      background: #fff;
      border: 1px solid var(--line);
      border-radius: 8px;
    }

    .panel-head {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 20px;
      align-items: center;
      padding: 15px 18px 12px;
      border-bottom: 1px solid #e4ebf4;
    }

    .section-kicker {
      color: var(--blue);
      font-size: 12px;
      font-weight: 900;
    }

    .panel h2 {
      margin: 4px 0 0;
      font-size: 22px;
      letter-spacing: 0;
    }

    .notice {
      max-width: 540px;
      color: #5b6f87;
      font-size: 12px;
      line-height: 1.45;
      text-align: right;
    }

    .kpis {
      display: grid;
      grid-template-columns: repeat(5, minmax(0, 1fr));
      gap: 9px;
      padding: 12px 18px;
      background: #f8fbff;
      border-bottom: 1px solid #e4ebf4;
    }

    .kpi {
      min-height: 68px;
      padding: 9px 11px;
      border: 1px solid #dce7f5;
      border-radius: 8px;
      background: #fff;
    }

    .kpi-label {
      color: #718299;
      font-size: 11px;
      font-weight: 800;
    }

    .kpi-value {
      margin-top: 5px;
      color: #123a6f;
      font-size: 20px;
      font-weight: 900;
      line-height: 1.1;
    }

    .kpi-note {
      margin-top: 4px;
      color: #697b91;
      font-size: 11px;
      line-height: 1.25;
    }

    .note-subtabs {
      display: flex;
      gap: 8px;
      align-items: center;
      padding: 10px 18px;
      border-bottom: 1px solid #e4ebf4;
      background: #fff;
    }

    .note-subtab {
      border: 1px solid #cfddec;
      border-radius: 999px;
      background: #fff;
      color: #385371;
      cursor: pointer;
      padding: 7px 13px;
      font-size: 12px;
      font-weight: 900;
    }

    .note-subtab.active {
      border-color: var(--navy);
      background: var(--navy);
      color: #fff;
    }

    .note-subtab span {
      margin-left: 6px;
      color: inherit;
      opacity: .76;
      font-weight: 800;
    }

    .table-wrap {
      flex: 1;
      overflow: auto;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      table-layout: fixed;
      text-align: left;
      font-size: 12px;
    }

    th {
      position: sticky;
      top: 0;
      z-index: 2;
      padding: 10px 12px;
      background: #eef4fb;
      border-bottom: 1px solid #d9e4f1;
      color: #445c77;
      font-size: 11px;
      font-weight: 900;
    }

    td {
      padding: 10px 12px;
      border-bottom: 1px solid #edf2f8;
      color: #45596f;
      line-height: 1.38;
      vertical-align: top;
      word-break: keep-all;
    }

    td:first-child {
      color: #132a45;
      font-weight: 900;
    }

    .material-table { min-width: 1240px; }
    .note-table { min-width: 1320px; }

    .point {
      color: #183b68;
      font-weight: 800;
    }

    .owner {
      color: #52667d;
      font-weight: 700;
    }

    .type-pill {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: 44px;
      padding: 4px 8px;
      border-radius: 999px;
      font-size: 11px;
      font-weight: 900;
      white-space: nowrap;
    }

    .connected { background: #edf5ff; color: #1d5db8; }
    .separate { background: #f1efff; color: var(--purple); }

    .status {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: 64px;
      padding: 4px 8px;
      border-radius: 999px;
      font-size: 11px;
      font-weight: 900;
      white-space: nowrap;
    }

    .done { background: #e9f8f2; color: var(--green); }
    .progress { background: #fff5dd; color: var(--amber); }
    .request { background: #edf5ff; color: #1d5db8; }
    .ready { background: #f1f4f7; color: var(--gray); }
    .attention { background: #fff0ee; color: var(--red); }

    .footnote {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 18px;
      padding: 11px 18px;
      background: #f8fbff;
      color: #5d7088;
      border-top: 1px solid #e4ebf4;
      font-size: 11px;
      line-height: 1.45;
    }

    .footnote a {
      color: #1f64c8;
      font-weight: 800;
      text-decoration: none;
      white-space: nowrap;
    }

    .assets {
      height: 100%;
      min-height: 580px;
      display: grid;
      grid-template-rows: auto 1fr auto;
      gap: 14px;
      background: #fff;
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 18px;
    }

    .asset-head {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 22px;
      align-items: end;
      padding-bottom: 14px;
      border-bottom: 1px solid #e4ebf4;
    }

    .asset-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 14px;
    }

    .asset-card {
      min-height: 310px;
      display: flex;
      flex-direction: column;
      border: 1px solid #dbe6f3;
      border-radius: 8px;
      background: #fff;
      overflow: hidden;
    }

    .asset-card-title {
      padding: 16px;
      border-bottom: 1px solid #e7edf5;
      background: #f7fbff;
    }

    .asset-index {
      color: var(--blue);
      font-size: 12px;
      font-weight: 900;
    }

    .asset-card h3 {
      margin: 7px 0 0;
      font-size: 22px;
      line-height: 1.22;
      letter-spacing: 0;
    }

    .asset-body {
      flex: 1;
      padding: 15px 16px 8px;
    }

    .asset-body ul {
      margin: 0;
      padding: 0;
      list-style: none;
      display: grid;
      gap: 10px;
    }

    .asset-body li {
      position: relative;
      padding-left: 16px;
      color: #4f647b;
      font-size: 14px;
      line-height: 1.5;
    }

    .asset-body li::before {
      content: "";
      position: absolute;
      left: 0;
      top: .68em;
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--blue);
    }

    .asset-result {
      margin: 0 16px 16px;
      padding: 12px;
      border: 1px solid #d7e6f8;
      border-radius: 8px;
      background: #f7fbff;
      color: #183d6d;
      font-size: 13px;
      font-weight: 900;
      line-height: 1.45;
    }

    .workflow {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 10px;
    }

    .flow-step {
      padding: 12px 14px;
      border: 1px solid #dbe6f3;
      border-radius: 8px;
      background: #f8fbff;
      color: #3f5670;
      font-size: 13px;
      font-weight: 800;
      line-height: 1.35;
    }

    .flow-step span {
      display: block;
      margin-bottom: 5px;
      color: var(--blue);
      font-size: 11px;
      font-weight: 900;
    }

    @media (max-width: 900px) {
      .page { padding: 18px; }
      header, .titlebar, .panel-head, .asset-head { grid-template-columns: 1fr; }
      .doc-tag, .legend, .notice { justify-content: flex-start; text-align: left; }
      .tabs, .kpis, .asset-grid, .workflow { grid-template-columns: 1fr; }
      .panel, .assets { min-height: auto; }
      h1 { font-size: 31px; }
    }
  </style>
</head>

          <span class="tab-num">03</span>
        </button>
      </nav>

      <div id="screen"></div>
    </div>
  </main>

    const connectedNoteRows = connectedNotes.map((item, index) => noteProfile("연결", item, index));

    function renderKpis(kpis) {
      return `<div class="kpis">${kpis.map(kpi => `

          <div class="kpi-label">${kpi[0]}</div>
          <div class="kpi-value">${kpi[1]}</div>
          <div class="kpi-note">${kpi[2]}</div>
        </div>`).join("")}</div>`;
    }

    function renderMaterials() {
      return `<section class="panel">
        <div class="panel-head">
          <div>
            <div class="section-kicker">01 · COMPANY REQUEST TRACKER</div>

                <th>회사 담당자</th>
                <th>감사인 담당</th>
                <th>진행 상태</th>
                <th>보완 사항</th>
              </tr>
            </thead>
            <tbody>
              ${materialRows.map(row => `<tr>
                <td>${row[0]}</td>

          <a target="_blank" rel="noopener" href="${sourceUrl}">2025 사업보고서 원문</a>
        </div>
      </section>`;
    }

    function renderNoteRows(rows) {
      return rows.map(row => `<tr>
        <td>${row[1]}</td>
        <td><span class="point">${row[2]}</span></td>
        <td class="owner">${row[3]}</td>
        <td class="owner">${row[4]}</td>
        <td><span class="status ${row[6]}">${row[5]}</span></td>

    }

    function renderNotes() {
      const rows = currentNoteType === "연결" ? connectedNoteRows : separateNoteRows;
      const count = rows.length;
      return `<section class="panel">

          <div>
            <div class="section-kicker">02 · DISCLOSURE NOTE REVIEW</div>
            <h2>골프존 주석 검토 진행 사항</h2>

        </div>
        ${renderKpis(noteKpis)}
        <div class="note-subtabs" aria-label="주석 구분">

            </colgroup>
            <thead>
              <tr>
                <th>주석 항목</th>

                <th>회사 담당자</th>
                <th>감사인 담당</th>
                <th>진행 상태</th>
                <th>검토·보완 사항</th>

            <tbody>${renderNoteRows(rows)}</tbody>

      </section>`;
    }

    function switchNoteType(type) {
      currentNoteType = type;
      document.getElementById("screen").innerHTML = renderNotes();
    }

    function renderAssets() {
      return `<section class="assets">
        <div class="asset-head">
          <div>
            <div class="section-kicker">03 · AUTOMATION ASSETS</div>
            <h2>AI 교육·자동화 자산</h2>
          </div>
          <div class="notice">목표는 AI 홍보가 아니라, 회계팀 반복업무를 줄이고 다음 결산에도 계속 쓰는 회사 내부 자산을 남기는 것입니다.</div>
        </div>
        <div class="asset-grid">
          ${assetCards.map(card => `<article class="asset-card">
            <div class="asset-card-title">
              <div class="asset-index">${card.index}</div>
              <h3>${card.title}</h3>

            <div class="asset-body">
              <ul>${card.bullets.map(item => `<li>${item}</li>`).join("")}</ul>
            </div>
            <div class="asset-result">${card.result}</div>
          </article>`).join("")}
        </div>
        <div class="workflow" aria-label="자동화 자산 활용 흐름">
          <div class="flow-step"><span>INPUT</span>ERP 원장·보조부·엑셀 자료</div>
          <div class="flow-step"><span>PROCESS</span>표준화·대사·예외 추출</div>
          <div class="flow-step"><span>OUTPUT</span>감사 요청자료·검토 파일</div>
          <div class="flow-step"><span>ASSET</span>템플릿·매뉴얼·재사용 규칙</div>
        </div>
      </section>`;
    }

    function view(id, element) {
      document.querySelectorAll(".tab").forEach(tab => tab.classList.remove("active"));
      element.classList.add("active");
      document.getElementById("screen").innerHTML = id === "materials" ? renderMaterials() : id === "notes" ? renderNotes() : renderAssets();
    }

    view("materials", document.querySelector(".tab"));
  </script>
</body>
