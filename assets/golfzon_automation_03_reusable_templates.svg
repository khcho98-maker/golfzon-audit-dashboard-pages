<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">재사용 템플릿과 매뉴얼</title>
  <desc id="desc">골프존의 계정 구조와 결산 절차를 반영한 템플릿과 매뉴얼을 다음 분기와 연말결산에 재사용하는 상세 업무 흐름</desc>
  <style>
    text{font-family:Arial,'Pretendard','Noto Sans KR','Malgun Gothic',sans-serif}.k{fill:#1d64be;font-size:20px;font-weight:800;letter-spacing:2px}.h{fill:#152f56;font-size:48px;font-weight:800;letter-spacing:-2px}.sub{fill:#617792;font-size:21px}.card{fill:#fff;stroke:#cfdeef;stroke-width:2}.soft{fill:#f6faff;stroke:#d6e4f3;stroke-width:2}.cap{fill:#1b5fb6;font-size:18px;font-weight:800;letter-spacing:1px}.label{fill:#173860;font-size:20px;font-weight:800}.small{fill:#637994;font-size:17px}.tiny{fill:#7186a0;font-size:14px}.white{fill:#fff;font-size:18px;font-weight:800}.pill{fill:#eaf3ff}.pilltext{fill:#1d61ba;font-size:15px;font-weight:800}.line{stroke:#2d71c8;stroke-width:4;fill:none;stroke-linecap:round;stroke-linejoin:round}.grid{stroke:#d7e5f4;stroke-width:2}.shadow{filter:url(#shadow)}
  </style>
  <defs>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#245184" flood-opacity=".08"/></filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#2d71c8"/></marker>
  </defs>
  <rect width="1600" height="900" fill="#fff"/>
  <rect x="54" y="47" width="1492" height="806" rx="28" fill="#f8fbff" stroke="#d8e5f2" stroke-width="2"/>
  <text x="104" y="112" class="k">03 · REUSABLE ASSETS</text>
  <text x="104" y="174" class="h">재사용 템플릿·매뉴얼</text>
  <text x="104" y="211" class="sub">한 번 만든 골프존 기준을 다음 분기·연말결산에도 그대로 사용하는 회사 내부 업무 자산으로 남깁니다.</text>
  <rect x="1121" y="92" width="359" height="44" rx="22" class="pill"/>
  <text x="1152" y="120" class="pilltext">시연 예시 · 담당자 변경에도 같은 방식으로</text>

  <!-- template library -->
  <g class="shadow">
    <rect x="105" y="276" width="455" height="378" rx="22" class="card"/>
    <path d="M127 276H538a22 22 0 0 1 22 22v48H105v-48a22 22 0 0 1 22-22Z" fill="#2162bc"/>
    <text x="136" y="320" class="white">골프존 기준 업무 자산</text>
    <text x="136" y="382" class="cap">01. 재사용 가능한 템플릿 라이브러리</text>
    <path d="M136 416h76l13 14h294v155H136z" fill="#e7f1ff" stroke="#bad1ef" stroke-width="2"/>
    <path d="M136 416h76l13 14h-89z" fill="#2d71c8"/>
    <rect x="162" y="456" width="332" height="31" rx="7" fill="#fff"/><circle cx="182" cy="472" r="7" fill="#2d71c8"/><text x="202" y="478" class="small">계정·컬럼 매핑표</text>
    <rect x="162" y="498" width="332" height="31" rx="7" fill="#fff"/><circle cx="182" cy="514" r="7" fill="#19a47c"/><text x="202" y="520" class="small">결산 체크리스트</text>
    <rect x="162" y="540" width="332" height="31" rx="7" fill="#fff"/><circle cx="182" cy="556" r="7" fill="#e59a20"/><text x="202" y="562" class="small">계정대사 규칙 · 주석 수집 양식</text>
    <rect x="136" y="600" width="383" height="28" rx="14" fill="#eaf3ff"/><text x="160" y="620" class="pilltext">골프존 계정 구조와 결산 일정에 맞춤</text>
  </g>

  <!-- manual -->
  <path d="M562 454H645" class="line" marker-end="url(#arrow)"/>
  <text x="572" y="431" class="pilltext">사용 방법</text>
  <g>
    <rect x="665" y="294" width="324" height="334" rx="22" class="soft"/>
    <text x="697" y="339" class="cap">WORKING MANUAL · 사용 매뉴얼</text>
    <rect x="696" y="365" width="262" height="72" rx="12" fill="#fff" stroke="#d6e5f4"/><circle cx="728" cy="401" r="17" fill="#2162bc"/><text x="722" y="407" fill="#fff" font-size="17" font-weight="800">1</text><text x="761" y="397" class="label">파일 선택</text><text x="761" y="421" class="tiny">ERP·엑셀 자료 업로드</text>
    <rect x="696" y="449" width="262" height="72" rx="12" fill="#fff" stroke="#d6e5f4"/><circle cx="728" cy="485" r="17" fill="#2162bc"/><text x="722" y="491" fill="#fff" font-size="17" font-weight="800">2</text><text x="761" y="481" class="label">실행</text><text x="761" y="505" class="tiny">표준화·대사 자동 실행</text>
    <rect x="696" y="533" width="262" height="72" rx="12" fill="#fff" stroke="#d6e5f4"/><circle cx="728" cy="569" r="17" fill="#2162bc"/><text x="722" y="575" fill="#fff" font-size="17" font-weight="800">3</text><text x="761" y="565" class="label">예외 확인 · 결과 저장</text><text x="761" y="589" class="tiny">다음 결산에도 같은 기준 적용</text>
  </g>

  <!-- next close user interface -->
  <path d="M991 454H1070" class="line" marker-end="url(#arrow)"/>
  <text x="1003" y="431" class="pilltext">직접 활용</text>
  <g class="shadow">
    <rect x="1090" y="276" width="406" height="378" rx="22" class="card"/>
    <path d="M1112 276H1474a22 22 0 0 1 22 22v48H1090v-48a22 22 0 0 1 22-22Z" fill="#168c68"/>
    <text x="1121" y="320" class="white">다음 결산 실행 화면</text>
    <text x="1122" y="382" class="cap">02. 담당자가 직접 실행·수정</text>
    <rect x="1122" y="407" width="342" height="158" rx="12" fill="#f6faff" stroke="#d7e5f4"/>
    <circle cx="1170" cy="462" r="29" fill="#2d71c8"/><circle cx="1170" cy="452" r="10" fill="#fff"/><path d="M1152 484c5-16 30-16 36 0" fill="#fff"/>
    <rect x="1220" y="431" width="178" height="10" rx="5" fill="#dce8f5"/><rect x="1220" y="454" width="142" height="10" rx="5" fill="#dce8f5"/><rect x="1220" y="477" width="164" height="10" rx="5" fill="#dce8f5"/>
    <rect x="1144" y="519" width="138" height="26" rx="13" fill="#ecfdf5"/><text x="1174" y="538" fill="#087b59" font-size="13" font-weight="800">실행 완료</text>
    <rect x="1122" y="586" width="342" height="30" rx="15" fill="#eaf3ff"/><text x="1150" y="607" class="pilltext">이번 결산 결과를 템플릿에 반영</text>
  </g>

  <!-- cycle -->
  <path d="M1290 675c149 17 189-154 68-190" fill="none" stroke="#19a47c" stroke-width="4" stroke-linecap="round" marker-end="url(#arrow)"/>
  <text x="1295" y="704" fill="#087b59" font-size="16" font-weight="800">다음 분기·연말결산 재사용</text>

  <!-- benefits -->
  <rect x="105" y="731" width="1390" height="88" rx="16" fill="#eaf3ff"/>
  <rect x="132" y="752" width="342" height="45" rx="12" fill="#fff" stroke="#d6e5f4"/><circle cx="157" cy="774" r="10" fill="#2162bc"/><path d="M152 774h10" stroke="#fff" stroke-width="2.5"/><text x="181" y="781" class="label">담당자 변경에도 같은 기준</text>
  <rect x="499" y="752" width="342" height="45" rx="12" fill="#fff" stroke="#d6e5f4"/><circle cx="524" cy="774" r="10" fill="#19a47c"/><path d="M520 774l3 3 6-8" stroke="#fff" stroke-width="2.5" fill="none"/><text x="548" y="781" class="label">감사 대응 파일 재생성</text>
  <text x="891" y="781" fill="#17467f" font-size="22" font-weight="800">일회성 강의가 아니라, 회사에 남는 반복업무 감축 도구입니다.</text>
</svg>
